# テストの書き換えを検知する。
# PR で、テストの既存の行が変わった（変更・削除された）か、テストを無効にする書き方（skip など）が
# 足されたのに、PR 本文に「## テストを変えた理由」が書かれていなければ赤にする。テストを足すだけなら緑。
# 判定は .github/scripts/check_test_tamper.py（tests/guardrails/ でテストしている）。
name: test-tamper-check

# 見張るテストの場所。空白で区切って複数書ける（git のパス指定の書き方）。
# 他の言語ではここだけを変える。例："src/test/ tests/guardrails/" や ":(glob)**/*_test.go tests/guardrails/"
# tests/guardrails/（仕組みを守るテスト）は必ず残す。外すと、仕組みを守るテストを黙って消せてしまう。
env:
  TEST_PATHS: "tests/"

on:
  pull_request:
    # edited：PR 本文を直したときにも判定し直す
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test-tamper-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: テストの既存の行の変更や skip の追加が無いか確かめる
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # PR 本文は run に直接埋め込まず、環境変数で渡す（埋め込まれたスクリプトを実行させないため）
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_test_tamper.py
